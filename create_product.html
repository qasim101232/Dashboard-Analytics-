<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Add Medicine - PharmaCare</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <div id="overlay" class="overlay"></div>
  
  <!-- TOPBAR -->
  <nav id="topbar" class="navbar bg-white border-bottom fixed-top topbar px-3">
    <div class="d-flex align-items-center">
      <button id="toggleBtn" class="d-none d-lg-inline-flex btn btn-light btn-icon btn-sm me-2">
        <i class="ti ti-menu-2"></i>
      </button>
      <button id="mobileBtn" class="btn btn-light btn-icon btn-sm d-lg-none me-2">
        <i class="ti ti-menu-2"></i>
      </button>
      <span class="badge bg-primary me-2">Add Medicine</span>
    </div>
  </nav>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">
    <div class="logo-area">
      <a href="index.html" class="d-flex align-items-center text-decoration-none">
        <img src="https://via.placeholder.com/30/2c7da0/ffffff?text=PC" width="30" class="rounded">
        <span class="logo-text ms-2 fw-bold text-primary">PharmaCare</span>
      </a>
    </div>
    <ul class="nav flex-column">
      <li class="px-3 py-2"><small class="text-muted">MAIN</small></li>
      <li><a class="nav-link" href="index.html"><i class="ti ti-dashboard"></i><span>Dashboard</span></a></li>
      <li><a class="nav-link" href="inventory.html"><i class="ti ti-packages"></i><span>Inventory</span></a></li>
      <li><a class="nav-link" href="prescriptions.html"><i class="ti ti-prescription"></i><span>Prescriptions</span></a></li>
      <li><a class="nav-link active" href="create-product.html"><i class="ti ti-plus-circle"></i><span>Add Medicine</span></a></li>
    </ul>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="content" class="content">
    <div class="container-fluid p-4">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 mb-1">Add New Medicine</h1>
          <p class="text-muted mb-0">Add a new medicine to your inventory</p>
        </div>
        <div>
          <a href="inventory.html" class="btn btn-outline-secondary">
            <i class="ti ti-arrow-left me-1"></i>Back to Inventory
          </a>
        </div>
      </div>

      <!-- Form -->
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-body p-4">
              <form id="addMedicineForm" onsubmit="return saveMedicine()">
                <div class="row">
                  <!-- Basic Information -->
                  <div class="col-md-8">
                    <h5 class="mb-3">Basic Information</h5>
                    <div class="row mb-3">
                      <div class="col-md-6">
                        <label class="form-label">Medicine Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="medicineName" required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Generic Name</label>
                        <input type="text" class="form-control" id="genericName">
                      </div>
                    </div>
                    
                    <div class="row mb-3">
                      <div class="col-md-4">
                        <label class="form-label">SKU/Code <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="sku" value="MED" required>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Batch Number <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="batchNo" value="B2024-" required>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Manufacturer</label>
                        <input type="text" class="form-control" id="manufacturer">
                      </div>
                    </div>
                    
                    <div class="row mb-3">
                      <div class="col-md-4">
                        <label class="form-label">Category <span class="text-danger">*</span></label>
                        <select class="form-select" id="category" required>
                          <option value="">Select Category</option>
                          <option value="Antibiotic">Antibiotic</option>
                          <option value="Analgesic">Analgesic</option>
                          <option value="Antidiabetic">Antidiabetic</option>
                          <option value="Cardiovascular">Cardiovascular</option>
                          <option value="Respiratory">Respiratory</option>
                          <option value="Antihistamine">Antihistamine</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Type/Form <span class="text-danger">*</span></label>
                        <select class="form-select" id="type" required>
                          <option value="">Select Type</option>
                          <option value="Tablet">Tablet</option>
                          <option value="Capsule">Capsule</option>
                          <option value="Syrup">Syrup</option>
                          <option value="Injection">Injection</option>
                          <option value="Inhaler">Inhaler</option>
                          <option value="Ointment">Ointment</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Brand</label>
                        <input type="text" class="form-control" id="brand">
                      </div>
                    </div>
                  </div>
                  
                  <!-- Storage & Special -->
                  <div class="col-md-4">
                    <h5 class="mb-3">Storage & Special</h5>
                    <div class="mb-3">
                      <label class="form-label">Storage Temperature</label>
                      <select class="form-select" id="storageTemp">
                        <option value="Room Temperature">Room Temperature (15-25°C)</option>
                        <option value="Cool">Cool (8-15°C)</option>
                        <option value="Cold">Cold (2-8°C)</option>
                      </select>
                    </div>
                    <div class="mb-3">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="requiresPrescription">
                        <label class="form-check-label" for="requiresPrescription">
                          Requires Prescription (Rx Only)
                        </label>
                      </div>
                    </div>
                    <div class="mb-3">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="controlledSubstance">
                        <label class="form-check-label" for="controlledSubstance">
                          Controlled Substance
                        </label>
                      </div>
                    </div>
                  </div>
                </div>

                <hr class="my-4">

                <!-- Pricing & Stock -->
                <div class="row">
                  <div class="col-md-6">
                    <h5 class="mb-3">Pricing & Stock</h5>
                    <div class="row mb-3">
                      <div class="col-md-4">
                        <label class="form-label">Price ($) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="price" step="0.01" required>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Unit Type</label>
                        <select class="form-select" id="unit">
                          <option value="Strip">Strip</option>
                          <option value="Bottle">Bottle</option>
                          <option value="Vial">Vial</option>
                          <option value="Piece">Piece</option>
                          <option value="Box">Box</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label">Quantity <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="quantity" required>
                      </div>
                    </div>
                    <div class="row mb-3">
                      <div class="col-md-6">
                        <label class="form-label">Reorder Level</label>
                        <input type="number" class="form-control" id="reorderLevel" value="10">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Maximum Stock</label>
                        <input type="number" class="form-control" id="maxStock">
                      </div>
                    </div>
                  </div>
                  
                  <div class="col-md-6">
                    <h5 class="mb-3">Expiry Information</h5>
                    <div class="row mb-3">
                      <div class="col-md-6">
                        <label class="form-label">Manufacturing Date</label>
                        <input type="date" class="form-control" id="mfgDate">
                      </div>
                      <div class="col-md-6">
                        <label class="form-label">Expiry Date <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="expiryDate" required>
                      </div>
                    </div>
                  </div>
                </div>

                <hr class="my-4">

                <!-- Additional Info -->
                <div class="row">
                  <div class="col-12">
                    <h5 class="mb-3">Additional Information</h5>
                    <div class="mb-3">
                      <label class="form-label">Composition</label>
                      <input type="text" class="form-control" id="composition">
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Dosage Instructions</label>
                      <textarea class="form-control" id="dosage" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Side Effects / Warnings</label>
                      <textarea class="form-control" id="sideEffects" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Description</label>
                      <textarea class="form-control" id="description" rows="3"></textarea>
                    </div>
                  </div>
                </div>

                <div class="mt-4">
                  <button type="submit" class="btn btn-primary me-2">
                    <i class="ti ti-device-floppy me-1"></i>Save Medicine
                  </button>
                  <button type="reset" class="btn btn-secondary">
                    <i class="ti ti-x me-1"></i>Clear
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/js/main.js"></script>
  <script>
    function saveMedicine() {
      // Get form values
      const medicine = {
        name: document.getElementById('medicineName').value,
        genericName: document.getElementById('genericName').value,
        sku: document.getElementById('sku').value,
        batchNo: document.getElementById('batchNo').value,
        manufacturer: document.getElementById('manufacturer').value,
        category: document.getElementById('category').value,
        type: document.getElementById('type').value,
        brand: document.getElementById('brand').value,
        storageTemp: document.getElementById('storageTemp').value,
        requiresPrescription: document.getElementById('requiresPrescription').checked,
        controlledSubstance: document.getElementById('controlledSubstance').checked,
        price: document.getElementById('price').value,
        unit: document.getElementById('unit').value,
        quantity: document.getElementById('quantity').value,
        reorderLevel: document.getElementById('reorderLevel').value,
        maxStock: document.getElementById('maxStock').value,
        mfgDate: document.getElementById('mfgDate').value,
        expiryDate: document.getElementById('expiryDate').value,
        composition: document.getElementById('composition').value,
        dosage: document.getElementById('dosage').value,
        sideEffects: document.getElementById('sideEffects').value,
        description: document.getElementById('description').value
      };

      // Validate required fields
      if (!medicine.name || !medicine.sku || !medicine.batchNo || !medicine.category || 
          !medicine.type || !medicine.price || !medicine.quantity || !medicine.expiryDate) {
        alert('Please fill in all required fields');
        return false;
      }

      console.log('Medicine saved:', medicine);
      alert('Medicine added successfully!');
      document.getElementById('addMedicineForm').reset();
      return false;
    }
  </script>
</body>
</html>
